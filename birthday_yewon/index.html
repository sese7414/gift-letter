<!DOCTYPE html>
<html lang="ko">
<head>
<meta property="og:type" content="website">
<meta property="og:title" content="💌 선물 같은 편지가 도착했어요">
<meta property="og:description" content="지금 봉투를 열어보세요">
<meta property="og:image" content="https://sese7414.github.io/gift-letter/birthday_yewon/thumbnail.png">
<meta property="og:url" content="https://sese7414.github.io/gift-letter/birthday_yewon/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선물 같은 편지</title>

<style>
#intro {
  position: fixed;   /* 핵심 */
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;
  justify-content: center;  /* 세로 중앙 */
  align-items: center;      /* 가로 중앙 */

  background: #f7efe5;
  z-index: 10;
}

body {
  margin: 0;
  font-family: 'Pretendard', sans-serif;
  background: #f7efe5;
  display: flex;
  flex-direction: column;
  /*justify-content: center;*/
  /* 이거 있으면 스크롤하다가 잘림. 
  align-items: center; */
  /* ✅ 추가 */
  align-items: stretch;
  padding: 40px 16px; /* 스크롤 위한 위아래 여백*/

  /* 삭제!
  height: 100vh;
  overflow: hidden; */

  /* ✅ 추가 */
  min-height: 100vh;
  overflow-y: auto;

  }

/* 봉투 */
#envelope {
  width: 220px;
  cursor: pointer;
  transition: transform 0.3s;
}
#envelope:hover {
  transform: scale(1.05);
}

/* 편지 */
#letter {
  width: 100%;
  max-width: 400px;
  margin: 80px auto; /* 가운데 정렬 */

  background: #fffdf8;
  padding: 25px;
  border-radius: 15px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.15);

  display: none;
}

/* 텍스트 */
.text {
  white-space: pre-line;
  font-size: 16px;
  line-height: 1.6;
}

/* 사진 */
#photo {
  width: 100%;
  border-radius: 10px;
  margin-top: 15px;
  display: none;
}

/* CTA */
#cta {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  color: #888;
}

img {
  object-fit: contain;
}
</style>
</head>

<body>

<div id="intro">
  <img id="envelope" src="envelope.png">
  <p>봉투를 눌러 열어보세요 💌</p>
</div>

<div id="letter">
  <div class="text" id="text"></div>
  <img id="photo" src="photo.png"> 
  <div id="cta">💌 </div>  <!-- 나도 편지 보내기 -->
</div>

<script>
const message = `To. 항상 변함없이 옆에 있어주는 예원이에게
예원아, 음 뭐부터 이야기를 해야 할 지 모르겠다. 내가 지금 머리가 복잡해서 편지가 횡설수설할 수 있다는 거 먼저 감안해줘ㅋㅎㅋㅎ
그냥 너라는 친구를 만나서 대학시절 거의 내도록 붙어있고 추억을 만들 수 있어서 정말 다행이고 고마운 일이라고 생각해. 네가 나와 비슷하면서도 완전히 다른 사람이라 내가 너한테 얘기를 많이 하나봐.
어떻게 보면 이렇게 다른 사람이라 내가 더 많은 사람들을 이해할 수 있게 되었고 감정적으로 흔들리지도 않았던 것 같아. 내가 힘들 때나 좋을 때나 한결같이 내 친구로 그 자리에 있어줘서 진짜 고마워💗💗
한동을 떠나고 나니까 오히려 더 많이 생각나고 보고싶네... 어쩌다보니까 네 덕분에 네가 친해지니까 나도 친해진 그런 사람들도 있었고(지윤이 언니나 샘플 학회처럼) 우리가 함께 학교 다닐 때는
자주 보니까 외로울 틈도 없고 안정적이었던 것 같아. (물론 학교가 좁아서 인간관계가 정리가 안 될 때도 있었지만ㅋㅋㅋ)

고향을 떠나 타지에서 학교를 다니면서 고향이 그립고 외로울 수밖에 없는 시간들이 있는데 우리 새새 덕분에, 특히 너 덕분에 나는 즐거웠던 기억이 더더 많이 떠오른다. 외로웠던 건 순간들이었지만 대부분의 일상이 재밌었어ㅋㅋㅋ
힘들어도 같이 힘들고 좋은 일 있으면 같이 축하해주는 친구가 있다는 게 정말 귀한 거라는 걸 또 느꼈어. 내가 맨날 뜬금없이 전화하는데도 잘 받아줘서 고맙고 진짜 그럴 수 있는 친구 1순위가 너야,,, 
나에 대해 안 좋은 점도 좋은 점도 다 알아서 다 말하게 되는 것 같음ㅋㅋ큐ㅜㅠ 너도 언제든지 전화하면 되는 거 알지??!
지금도 취업이라는 문 앞에 서있는데 우리 둘 다 지치지 않고 마음을 다잡고 열심히 하자!!(사실 내가 잘 안 돼서 그럼ㅠㅜ)
변예원~!! 생일 진짜 너무너무 축하하고 태어나서 하나님의 계획 안에 온 학교에서 나라는 친구를 발견해줘서 고맙다💗💗💗

From. 항상 네가 고마운 세희`;

let i = 0;
const speed = 40;

function typeWriter() {
  if (i < message.length) {
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  } else {
    setTimeout(() => {
      document.getElementById("photo").style.display = "block";
    }, 500);
  }
}

document.getElementById("envelope").onclick = () => {
  document.getElementById("intro").style.display = "none";

  const letter = document.getElementById("letter");
  letter.style.display = "block";

  setTimeout(typeWriter, 300);
};
</script>

</body>
</html>
