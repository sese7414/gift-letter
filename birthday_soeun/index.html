<!DOCTYPE html>
<html lang="ko">
<head>
<meta property="og:type" content="website">
<meta property="og:title" content="💌 선물 같은 편지가 도착했어요">
<meta property="og:description" content="지금 봉투를 열어보세요">
<meta property="og:image" content="https://sese7414.github.io/gift-letter/birthday_soeun/thumbnail.png">
<meta property="og:url" content="https://sese7414.github.io/gift-letter/birthday_soeun/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선물 같은 편지</title>

<style>
#intro {
  position: fixed;   /* 핵심 */
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;
  justify-content: center;  /* 세로 중앙 */
  align-items: center;      /* 가로 중앙 */

  background: #f7efe5;
  z-index: 10;
}

body {
  margin: 0;
  font-family: 'Pretendard', sans-serif;
  background: #f7efe5;
  display: flex;
  flex-direction: column;
  /*justify-content: center;*/
  /* 이거 있으면 스크롤하다가 잘림. 
  align-items: center; */
  /* ✅ 추가 */
  align-items: stretch;
  padding: 40px 16px; /* 스크롤 위한 위아래 여백*/

  /* 삭제!
  height: 100vh;
  overflow: hidden; */

  /* ✅ 추가 */
  min-height: 100vh;
  overflow-y: auto;

  }

/* 봉투 */
#envelope {
  width: 220px;
  cursor: pointer;
  transition: transform 0.3s;
}
#envelope:hover {
  transform: scale(1.05);
}

/* 편지 */
#letter {
  width: 100%;
  max-width: 400px;
  margin: 80px auto; /* 가운데 정렬 */

  background: #fffdf8;
  padding: 25px;
  border-radius: 15px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.15);

  display: none;
}

/* 텍스트 */
.text {
  white-space: pre-line;
  font-size: 16px;
  line-height: 1.6;
}

/* 사진 */
#photo {
  width: 100%;
  border-radius: 10px;
  margin-top: 15px;
  display: none;
}

/* CTA */
#cta {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  color: #888;
}

img {
  object-fit: contain;
}
</style>
</head>

<body>

<div id="intro">
  <img id="envelope" src="envelope.png">
  <p>봉투를 눌러 열어보세요 💌</p>
</div>

<div id="letter">
  <div class="text" id="text"></div>
  <img id="photo" src="photo.jpeg"> 
  <div id="cta">💌 </div>  <!-- 나도 편지 보내기 -->
</div>

<script>
const message = `To. 언니처럼 신경써주고 친구처럼 편안한 소은이언니에게
언니~!! 생일 축하를 너무 제대로 해주고 싶은 마음에 한참 지나서,,, 추석 때 같이 해주게 되었어...
미안해😭ㅠㅜ 완벽하게 해주고 싶어서 내 안의 회피가 또다시 발동이 걸렸나봐.. 사실 그것도 있고
그때 말했던 것처럼 학원 일이 많아지기도 했고 영어시험이랑 취준때문에 스트레스받아서 모든 것을 내려놓고 싶은 마음이 있었어 !
(그 자체가 문제라기보다는 내가 나 자신을 봤을 때 마음에 안 드는 부분도 많았거든)
그래서 정리되고 바로 연락해야지 했는데 넘 늦게 연락했더라고,,, 공부하려고 인스타도 지웠어서 더 연락이 바로 안 되었을 거야ㅠㅜ
그때도 미안하다 했지만 다시 한 번 미안하다고 말하고 싶어. 용서해줄 수 있을까?

근데 나도 내 마음의 소용돌이때문에 나를 챙기지 못할 때, 언니가 나 괜찮냐고 물어봐줘서 사실 진짜 울컥했어...
언니덕분에 내가 그래도 타인에게 인지되는, 소중한 사람이었지 생각하게 되더라. 그래서 신앙적으로도 하나님과 멀어져있는
상태였는데 다시 기도할 수 있게 되었어. 그래서 우리 여행 때 말했던 이번에 맡게 된 소그룹 리더도 정말 잘 할 것 같다는 생각이 들더라구!!
그리고 이런 언니니까 더 다른 사람과의 관계에 크게 신경쓰지 않아도 될 것 같아! 안 맞는 사람은 있어도 결국에는 
모두 언니를 사랑할 수밖에 없다고 난 생각해ㅋㅎㅋㅎ

언니 생일을 너무 늦게 축하하지만 내년에는 진짜 제 때 축하해줄게! 언니가 이 세상에 태어나서 한동에서 나와 만날 수 있게 된게
하나님께 감사해💗💗💗 내가 한동에서 힘들었던 시간뿐만이 아니라 행복했던 시간도 함께해줘서 고마워💗💗
이번 추석도 맛있는 거 많이 먹고 연휴기간동안 푹 쉴 수 있었으면 좋겠어~!!

From. 언니 덕분에 항상 힘이 나는 세희`;

let i = 0;
const speed = 40;

function typeWriter() {
  if (i < message.length) {
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  } else {
    setTimeout(() => {
      document.getElementById("photo").style.display = "block";
    }, 500);
  }
}

document.getElementById("envelope").onclick = () => {
  document.getElementById("intro").style.display = "none";

  const letter = document.getElementById("letter");
  letter.style.display = "block";

  setTimeout(typeWriter, 300);
};
</script>

</body>
</html>
