<!DOCTYPE html>
<html lang="ko">
<head>
<meta property="og:type" content="website">
<meta property="og:title" content="💌 선물 같은 편지가 도착했어요">
<meta property="og:description" content="지금 봉투를 열어보세요">
<meta property="og:image" content="https://sese7414.github.io/gift-letter/birthday_hyeonji/thumbnail_hj.png">
<meta property="og:url" content="https://sese7414.github.io/gift-letter/birthday_hyeonji/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선물 같은 편지</title>

<style>
#intro {
  position: fixed;   /* 핵심 */
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;
  justify-content: center;  /* 세로 중앙 */
  align-items: center;      /* 가로 중앙 */

  background: #f7efe5;
  z-index: 10;
}

body {
  margin: 0;
  font-family: 'Pretendard', sans-serif;
  background: #f7efe5;
  display: flex;
  flex-direction: column;
  /*justify-content: center;*/
  /* 이거 있으면 스크롤하다가 잘림. 
  align-items: center; */
  /* ✅ 추가 */
  align-items: stretch;
  padding: 40px 16px; /* 스크롤 위한 위아래 여백*/

  /* 삭제!
  height: 100vh;
  overflow: hidden; */

  /* ✅ 추가 */
  min-height: 100vh;
  overflow-y: auto;

  }

/* 봉투 */
#envelope {
  width: 220px;
  cursor: pointer;
  transition: transform 0.3s;
}
#envelope:hover {
  transform: scale(1.05);
}

/* 편지 */
#letter {
  width: 100%;
  max-width: 400px;
  margin: 80px auto; /* 가운데 정렬 */

  background: #fffdf8;
  padding: 25px;
  border-radius: 15px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.15);

  display: none;
}

/* 텍스트 */
.text {
  white-space: pre-line;
  font-size: 16px;
  line-height: 1.6;
}

/* 사진 */
#photo {
  width: 100%;
  border-radius: 10px;
  margin-top: 15px;
  display: none;
}

/* CTA */
#cta {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  color: #888;
}

img {
  object-fit: contain;
}
</style>
</head>

<body>

<div id="intro">
  <img id="envelope" src="envelope_hj.png">
  <p>봉투를 눌러 열어보세요 💌</p>
</div>

<div id="letter">
  <div class="text" id="text"></div>
  <img id="photo" src="photo_hj.jpeg"> 
  <div id="cta">💌 </div>  <!-- 나도 편지 보내기 -->
</div>

<script>
const message = `To. 만날 때마다 아낌없이 사랑을 주는 현지언니에게
언니! 저는 언니가 왜이렇게 좋을까요ㅋㅎㅋㅎ 언니랑 만나면 뭔가 한없이 어려지는 기분이에요ㅎㅎ
그리고 하나부터 열까지 다 너무 재밌어요! ㅋㅋㅋㅋ 항상 절 너무 귀여워해주고 챙겨줘서 고마워요💕💕
언니 벨기에 간 거 열심히 본다고 했는데 오창갔다와서 공부해야할 것 같아서 인스타를 지웠어요ㅠㅜㅠ
너무 아쉽다 !! 언니를 봐도봐도 왜이렇게 그리울까요??! 같이 살았어서 더 그런걸까요??

한동에서 언니를 만나서, 또 우리 404를 만나서 정말 재밌게 학교생활을 보냈어요~! 저의 첫 해외여행(가족 아닌)을
언니가 함께 해줘서 더 평화롭게 할 수 있었던 것 같아요ㅋㅎㅋㅎ 전주나 오창/청주에서도 언니덕분에
맛있는 거 왕창 먹고 예쁘고 신기한 거 많이 보고 재밌게 웃으면서 여행을 잘 할 수 있었어요!
포항갈 때도 언니 집에 재워주고 챙겨주고 했던 거밖에 기억이 안 나요ㅋㅋㅋㅋ 진짜 저는 암것도 안했는데 언니가 절 너무
아껴줘서 진짜 고마워요💕💕

생일을 벨기에 시간 맞춰서 축하해주려다가 시간을 놓쳐서🥲 추석이랑 같이 축하해요!! 추석 연휴도 잘 보내고 있죠?
푹 쉬면서 가족들과 행복한 시간 보내길 바라요💕💕 언니 생일도 정말정말 축하했어요!!!💕💕

그냥 앞으로도 언니랑 보고 얘기하고 또 여행가면 좋을 것 같아요! 다음번에는 제가 어딘가 정착한다면...? 그곳에서 풀코스로 모시겠습니다🙇🏻‍♀️
항상 언니가 저 챙겨줘서 그때는 꼭 제가!! 언니를 대접하고 싶어요ㅎㅎ

언니는 지금 위치가 불안하다고 했지만 그래도 언니는 잘할 수 있을 거라 저는 믿어요!! 원래 어찌저찌 해내도 해낸 건 해낸 거니까ㅋㅎㅋㅎ
농담이구 너무 부담가지지 말고 지금까지처럼 하면 잘 될 거라 저는 생각해요!!

언니 💕💕해요~~(편지라서 할 수 있는 말)

From. 언니가 있어서 든든한 세희`;

let i = 0;
const speed = 40;

function typeWriter() {
  if (i < message.length) {
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  } else {
    setTimeout(() => {
      document.getElementById("photo").style.display = "block";
    }, 500);
  }
}

document.getElementById("envelope").onclick = () => {
  document.getElementById("intro").style.display = "none";

  const letter = document.getElementById("letter");
  letter.style.display = "block";

  setTimeout(typeWriter, 300);
};
</script>

</body>
</html>
